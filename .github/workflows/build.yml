name: Build Velvet 3
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build rootless package (macOS)
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ldid xz dpkg
      - name: Check out Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
      - name: Build package
        run: make package FINALPACKAGE=1
      - name: Verify architecture slices
        run: python3 tools/check-slices.py --require-arm64e packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: velvet3-deb
          path: packages/*.deb
          if-no-files-found: error
